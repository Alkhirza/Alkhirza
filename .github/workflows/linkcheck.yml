name: Check README links

on:
  schedule:
    - cron: "0 3 * * 1"      # Mondays at 03:00 UTC
  push:
    paths:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress README.md
          fail: false